<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" preserveAspectRatio="xMidYMid slice">
  <!-- 新基金還沒有封面時的中性預設圖（使用者 2026-11-20）；封面等整站重新設計再補。 -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#29313D"/>
      <stop offset="1" stop-color="#1E2329"/>
    </linearGradient>
    <pattern id="p" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#474D57" stroke-opacity=".35" stroke-width="1"/>
