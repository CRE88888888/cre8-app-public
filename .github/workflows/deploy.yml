name: Deploy (Cloudflare Pages)

# 只有 main 分支的 push 才部署；PR 只跑 CI（見 ci.yml）。
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # 部署不能取消中斷：寧可排隊，也不要在 Cloudflare 上留下半套

jobs:
  deploy:
    name: build + deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 沒設 secrets 時整個 job 跳過 —— fork 的 PR / 未設定的 repo 不會變成紅燈。
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    environment:
      name: production
      url: https://beta.cre8.finance

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      # 早退：secrets 沒設就不要讓 workflow 紅 —— 它只是「這台還沒接上部署」。
      - name: Check deploy credentials
        id: creds
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 未設定，跳過部署"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Pages
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 專案名與分支：production 分支是 main，推到同一條分支才會更新 beta.cre8.finance
          command: pages deploy dist --project-name=cre8-atp --branch=main
